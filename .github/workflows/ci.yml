name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lib:
    runs-on: ubuntu-latest
    steps:
      # lfs: true pulls the shapefile/KML objects in data/ — without it,
      # actions/checkout leaves the 130-byte LFS pointers in place.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Target the test csproj, not the slnx — the slnx pulls in the MAUI app
      # (needs the android workload) and the harness project.
      - run: dotnet test lib/CanadaRidingTagger/tests/CanadaRidingTagger.Tests/CanadaRidingTagger.Tests.csproj

      # Pack without publishing: verifies the shapefile Content/PackagePath
      # globs still resolve against data/ on a fresh checkout.
      - run: dotnet pack lib/CanadaRidingTagger/CanadaRidingTagger.csproj -c Release
        shell: bash

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Single line, space-separated — the action splits on spaces only. Omit
      # platform-tools: the runner image already has it, and sdkmanager exits
      # non-zero for installed packages, failing the step. android-36 and
      # build-tools 36.0.0 are the exact versions the build resolves
      # (AndroidSdkPlatformVersion / AndroidSdkBuildToolsVersion).
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platforms;android-36 build-tools;36.0.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet workload install maui-android

      # Debug for PR feedback — the Release config enables AOT (see csproj),
      # which is slow here; the release job covers the AOT path.
      - run: dotnet build app/FindMyRiding/FindMyRidingApp.csproj -c Debug

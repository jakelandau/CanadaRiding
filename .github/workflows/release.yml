name: release

on:
  push:
    tags: [v*]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Full history so MinVer sees the v* tag it versioning from; without
      # this it silently falls back to 0.2.0-alpha.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Single line, space-separated — the action splits on spaces only. Omit
      # platform-tools: the runner image already has it, and sdkmanager exits
      # non-zero for installed packages, failing the step. android-36 and
      # build-tools 36.0.0 are the exact versions the build resolves
      # (AndroidSdkPlatformVersion / AndroidSdkBuildToolsVersion).
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platforms;android-36 build-tools;36.0.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet workload install maui-android

      - run: dotnet pack lib/CanadaRidingTagger/CanadaRidingTagger.csproj -c Release

      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      # Release config enables AOT (see csproj).
      - run: >
          dotnet build app/FindMyRiding/FindMyRidingApp.csproj -c Release
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=keystore.jks
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidKeyStorePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet API key — no long-lived key in secrets. Requires the
      # `NUGET_USER` secret (nuget.org profile name) and a trusted-publishing
      # policy on nuget.org for this repo's release.yml workflow.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: >
          dotnet nuget push lib/CanadaRidingTagger/bin/Release/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
        shell: bash

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            lib/CanadaRidingTagger/bin/Release/*.nupkg
            app/FindMyRiding/bin/Release/net10.0-android/com.findmyriding.app-Signed.apk
          generate_release_notes: true
